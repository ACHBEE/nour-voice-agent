// Retrieval service for the Nour voice agent.
// Python stubs are generated by `python scripts/gen_proto.py` into rag_service/pb/ (never hand-edit).

syntax = "proto3";

package nour.rag.v1;

service RagService {
  // Hybrid (vector + full-text) search over the clinic knowledge base.
  rpc Search(SearchRequest) returns (SearchResponse);
}

enum SearchMode {
  SEARCH_MODE_HYBRID = 0;   // vector + keyword, fused with reciprocal rank fusion (default)
  SEARCH_MODE_VECTOR = 1;   // dense embeddings only
  SEARCH_MODE_KEYWORD = 2;  // Postgres full-text only
}

message SearchRequest {
  string query = 1;
  // Number of chunks to return. 0 means the server default.
  int32 top_k = 2;
  // Caller language hint: "ar", "fr" or "en" (empty = unknown). Used for logging and query
  // handling only; results are NOT filtered by language, because answers often live in a
  // document written in another language (cross-lingual retrieval).
  string language = 3;
  SearchMode mode = 4;
}

message Chunk {
  int64 chunk_id = 1;
  string doc_id = 2;        // stable document id, e.g. "prices"
  string title = 3;         // document title
  string section = 4;       // markdown heading the chunk came from
  string content = 5;
  string lang = 6;          // language of the chunk text
  string source_path = 7;   // file name under data/clinic_docs/
  float score = 8;          // final score used for ranking (RRF score in hybrid mode)
  int32 vector_rank = 9;    // 1-based rank in the vector list, 0 if absent
  int32 keyword_rank = 10;  // 1-based rank in the keyword list, 0 if absent
}

message SearchResponse {
  repeated Chunk chunks = 1;
  float embed_ms = 2;   // time to embed the query
  float search_ms = 3;  // time spent in Postgres + fusion
}
