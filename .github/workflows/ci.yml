name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests, retrieval eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: nour
          POSTGRES_USER: nour
          POSTGRES_PASSWORD: nour_dev # throwaway CI database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nour -d nour"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://nour:nour_dev@localhost:5432/nour
      PGPASSWORD: nour_dev
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: gRPC stubs match proto/rag.proto
        run: |
          python scripts/gen_proto.py
          git diff --exit-code rag_service/pb

      - name: Load database schema
        run: psql -h localhost -U nour -d nour -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('rag_service/embeddings.py', 'rag_service/config.py') }}

      - name: Ingest clinic documents into pgvector
        run: python -m rag_service.ingest

      - name: Tests (unit + live Postgres / retrieval, no LLM keys needed)
        run: pytest -q

      # Quality gate on retrieval only: deterministic and free. The LLM-judged evals need
      # LiveKit keys and cost money, so they run locally (python evals/run_evals.py).
      - name: Retrieval eval (hybrid hit@5 must stay >= 70%)
        run: python evals/run_evals.py --retrieval-only --min-hit-rate 0.70 --tag ci

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: evals/results/ci.*

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nour:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
